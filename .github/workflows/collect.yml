name: Collect reviews

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (GitHub may run it a few minutes late)
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: collect-reviews
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python collect_reviews.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews.csv
          if git diff --cached --quiet; then
            echo "No new reviews"
          else
            git commit -m "Update reviews $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
